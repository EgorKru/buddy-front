services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://pager.website/api
        - NEXT_PUBLIC_WS_URL=wss://pager.website/ws
    container_name: pager-frontend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - pager-network

networks:
  pager-network:
    driver: bridge


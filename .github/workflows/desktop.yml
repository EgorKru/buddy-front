name: Windows desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      HUSKY: '0'
      PAGER_APP_URL: https://pager.website
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run desktop:build:win
      - uses: actions/upload-artifact@v7
        with:
          name: pager-windows-${{ github.ref_name }}
          path: dist-desktop/*.exe
          if-no-files-found: error
